[package]
name = "emberwish"
version = "0.1.0"
description = "A quiet desktop incense ritual"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "emberwish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
